<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mtimukulu's Quiz Game</title>

<link rel="stylesheet" href="Game.css">

</head>
<body><div class="container">

    <header>
        <h1>🎮 HACKERS QUIZ</h1>
        <p>Test your brain. Beat the challenge!</p>
    </header>

    <div class="game-box">

        <div class="game-info">
            <span id="question-number">Question 1</span>
            <span id="score">Score: 0</span>
        </div>

        <div class="progress-bar">
            <div id="progress"></div>
        </div>

        <h2 id="question">Loading question...</h2>

        <div id="answers" class="answers"></div>

        <p id="feedback" aria-live="polite"></p>

        <button id="next-button" disabled>
            Next Question ➜
        </button>

        <div id="result" class="hidden">
            <h2>🏆 Quiz Completed!</h2>
            <p id="final-score"></p>
            <button id="restart-button">Play Again 🔄</button>
        </div>

    </div>

    <footer>
        <p>Made with ❤️ Mtimukulu's Gaming Website</p>
    </footer>

</div>

<script src="Game.js"></script>

</body>
</html>
